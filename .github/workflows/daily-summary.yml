name: SPUTNIK Daily Summary

on:
  schedule:
    # Ogni giorno alle 06:00 UTC
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  summary:
    name: Send daily opportunity summary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Send summary
        run: |
          python - <<'PY'
          import os, json, urllib.request
          from telegram.sputnik_watch import build_watch_message
          from telegram_delivery import confirmed_message_id

          token = os.getenv("TELEGRAM_BOT_TOKEN", "").strip()
          chat = os.getenv("TELEGRAM_CHAT_ID", "").strip()
          if not token or not chat:
              raise SystemExit("Missing Telegram secrets; summary was not sent.")

          # Preferisci lo stato dedicato; usa main solo durante la migrazione
          # iniziale o se il branch dedicato non è ancora disponibile.
          state = {}
          state_sources = (
              ("sputnik-state", "https://raw.githubusercontent.com/andreameloni1984-sys/trump-trucker/sputnik-state/sputnik_state.json"),
              ("main fallback", "https://raw.githubusercontent.com/andreameloni1984-sys/trump-trucker/main/sputnik_state.json"),
          )
          for source_name, state_url in state_sources:
              try:
                  req = urllib.request.Request(
                      state_url,
                      headers={"User-Agent": "SPUTNIK Daily Summary"},
                  )
                  with urllib.request.urlopen(req, timeout=15) as r:
                      candidate = json.loads(r.read().decode("utf-8"))
                  if not isinstance(candidate, dict):
                      raise ValueError("state root is not an object")
                  state = candidate
                  print(f"SPUTNIK state loaded from {source_name}.")
                  break
              except Exception as exc:
                  print(f"SPUTNIK state load failed from {source_name}: {type(exc).__name__}")

          watch = build_watch_message(state, min_score=55)
          text = "🛰️ **SPUTNIK — RIEPILOGO GIORNALIERO**\n\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\n"
          if watch:
              text += watch
          else:
              text += "Nessun candidato in watch oggi.\nControlla i pulsanti per i dettagli."

          payload = json.dumps({"chat_id": chat, "text": text}).encode()
          req = urllib.request.Request(
              f"https://api.telegram.org/bot{token}/sendMessage",
              data=payload,
              headers={"Content-Type": "application/json"},
          )
          try:
              with urllib.request.urlopen(req, timeout=20) as r:
                  response = json.loads(r.read().decode("utf-8"))
              message_id = confirmed_message_id(response)
              if message_id is None:
                  raise RuntimeError(
                      "Telegram API did not confirm sendMessage: "
                      "expected ok=true and result.message_id."
                  )
              print(f"Telegram delivery confirmed: message_id={message_id}")
          except Exception as e:
              print(f"Telegram delivery failed or unconfirmed: {e}")
              raise
          PY
