name: SPUTNIK

on:
  schedule:
    - cron: '2-59/15 * * * *'
  workflow_dispatch:
permissions:
  actions: read
  contents: write

concurrency:
  group: sputnik-main
  queue: max
  cancel-in-progress: false

jobs:
  sputnik:
    if: vars.SPUTNIK_US_INTRADAY_ENABLED != 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Report recent scheduled collector runs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          response="$RUNNER_TEMP/sputnik-scheduled-runs.json"
          if ! curl --fail --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GH_REPOSITORY}/actions/workflows/trump_tracker.yml/runs?event=schedule&per_page=20" \
            -o "$response"; then
            echo "::warning::SPUTNIK scheduled-run history unavailable; cadence diagnosis incomplete."
            exit 0
          fi
          python - "$response" <<'PY'
          import json
          import sys
          from datetime import datetime

          try:
              with open(sys.argv[1], encoding="utf-8") as handle:
                  payload = json.load(handle)
          except (OSError, ValueError) as exc:
              print(f"::warning::SPUTNIK scheduled-run history response unreadable: {type(exc).__name__}")
              sys.exit(0)

          if not isinstance(payload, dict) or not isinstance(payload.get("workflow_runs"), list):
              print("::warning::SPUTNIK scheduled-run history response invalid; cadence diagnosis incomplete.")
              sys.exit(0)

          runs = payload.get("workflow_runs") or []
          runs.sort(key=lambda row: str(row.get("created_at") or ""))
          print("SPUTNIK: last scheduled collector runs (UTC)")
          previous = None
          for run in runs:
              created = str(run.get("created_at") or "")
              started = str(run.get("run_started_at") or "")
              print(
                  "SPUTNIK_SCHEDULE_RUN"
                  f" id={run.get('id')}"
                  f" number={run.get('run_number')}"
                  f" created_at={created}"
                  f" started_at={started or 'NOT_STARTED'}"
                  f" status={run.get('status')}"
                  f" conclusion={run.get('conclusion') or 'PENDING'}"
              )
              if previous and created:
                  try:
                      current_dt = datetime.fromisoformat(created.replace("Z", "+00:00"))
                      previous_dt = datetime.fromisoformat(previous.replace("Z", "+00:00"))
                      gap_minutes = (current_dt - previous_dt).total_seconds() / 60
                      print(f"SPUTNIK_SCHEDULE_GAP minutes={gap_minutes:.1f} expected_interval=5")
                  except (TypeError, ValueError, OverflowError):
                      print("SPUTNIK_SCHEDULE_GAP unavailable: timestamp parse error")
              if created:
                  previous = created
          print(f"SPUTNIK_SCHEDULE_RUN_COUNT={len(runs)}")
          PY

      - name: Check Telegram configuration
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ]; then
            echo "Telegram token: PRESENTE"
          else
            echo "Telegram token: ASSENTE"
          fi
          if [ -n "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram chat ID: PRESENTE"
          else
            echo "Telegram chat ID: ASSENTE"
          fi
          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then
            echo "ERRORE: configura il GitHub Secret TELEGRAM_BOT_TOKEN."
            exit 1
          fi
          if [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "::error::TELEGRAM_CHAT_ID is required: the scheduled collector sets SPUTNIK_TELEGRAM_POLLING=0 and cannot auto-discover a destination."
            exit 1
          fi

      - name: Run SPUTNIK (Render-independent)
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          SPUTNIK_CIKS: "1849635"
          SPUTNIK_SEC_FORMS: "3,4,5,8-K,13D,13G,13F-HR,13F-HR/A,144"
          SPUTNIK_SOCIAL_ENABLED: "1"
          GAGARIN_CLOUD_API_URL: ${{ secrets.GAGARIN_CLOUD_API_URL }}
          GAGARIN_CLOUD_API_KEY: ${{ secrets.GAGARIN_CLOUD_API_KEY }}
          NARWHAL_REFERENCE_ENABLED: "1"
          NARWHAL_API_KEY: ${{ secrets.NARWHAL_API_KEY }}
          SPUTNIK_MORNING_HOUR: "5"
          SPUTNIK_TELEGRAM_POLLING: "0"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python trump_tracker.py

      - name: Persist SPUTNIK state
        if: success()
        run: |
          if [ -f sputnik_state.json ]; then
            git config user.name "SPUTNIK Bot"
            git config user.email "sputnik-bot@users.noreply.github.com"
            git add sputnik_state.json
            if git diff --cached --quiet; then
              echo "SPUTNIK: stato invariato; nessun commit o push necessario."
              exit 0
            fi
            git commit -m "chore: persist Sputnik state"
            git fetch origin main
            if ! git rebase origin/main; then
              echo "::error::SPUTNIK state conflict; aborting instead of silently discarding deduplication state."
              git rebase --abort
              exit 1
            fi
            git push origin main
          fi


  sputnik-usa:
    if: vars.SPUTNIK_US_INTRADAY_ENABLED == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Collect and confirm Sputnik USA opportunities
        env:
          SPUTNIK_US_TELEGRAM_ENABLED: ${{ vars.SPUTNIK_US_TELEGRAM_ENABLED }}
          TELEGRAM_BOT_TOKEN: ${{ vars.SPUTNIK_US_TELEGRAM_ENABLED == 'true' && secrets.TELEGRAM_BOT_TOKEN || '' }}
          TELEGRAM_CHAT_ID: ${{ vars.SPUTNIK_US_TELEGRAM_ENABLED == 'true' && secrets.TELEGRAM_CHAT_ID || '' }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          SPUTNIK_REUTERS_FEED_URL: ${{ vars.SPUTNIK_REUTERS_FEED_URL }}
        run: python sputnik_us_intraday.py collect --outbox "$RUNNER_TEMP/sputnik-usa.json"

      - name: Persist Sputnik USA events and notification reservations
        run: |
          git config user.name "SPUTNIK Bot"
          git config user.email "sputnik-bot@users.noreply.github.com"
          git add sputnik_us_state.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: persist Sputnik USA state"
            git push origin HEAD:main
          fi

      - name: Deliver fresh paper signals
        if: vars.SPUTNIK_US_TELEGRAM_ENABLED == 'true'
        env:
          SPUTNIK_US_TELEGRAM_ENABLED: ${{ vars.SPUTNIK_US_TELEGRAM_ENABLED }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python sputnik_us_intraday.py deliver --outbox "$RUNNER_TEMP/sputnik-usa.json"
