name: SPUTNIK

on:
  push:
    branches:
      - main
    paths:
      - "trump_tracker.py"
      - "sputnik_action_reaction.py"
      - "telegram_listener.py"
      - ".github/workflows/trump_tracker.yml"
  workflow_dispatch:
    inputs:
      test_telegram:
        description: "Invia un messaggio di test a Telegram"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: sputnik-main
  cancel-in-progress: true

jobs:
  sputnik:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Telegram configuration
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ]; then
            echo "Telegram token: PRESENTE"
          else
            echo "Telegram token: ASSENTE"
          fi
          if [ -n "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram chat ID: PRESENTE"
          else
            echo "Telegram chat ID: ASSENTE"
          fi
          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then
            echo "ERRORE: configura il GitHub Secret TELEGRAM_BOT_TOKEN."
            exit 1
          fi
          if [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram chat ID: AUTO-DISCOVERY ATTIVO"
          fi

      - name: Keep Telegram listener online
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          SPUTNIK_TELEGRAM_SERVICE_URL: https://sputnik-telegram-listener.onrender.com
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 3 \
            -X POST \
            -H "X-Telegram-Bot-Token: $TELEGRAM_BOT_TOKEN" \
            -H "X-Telegram-Chat-Id: $TELEGRAM_CHAT_ID"
            "$SPUTNIK_TELEGRAM_SERVICE_URL/bootstrap"
          curl --fail --silent --show-error --retry 5 --retry-delay 3 \
            "$SPUTNIK_TELEGRAM_SERVICE_URL/health"

      - name: Run SPUTNIK
        env:
          SEC_USER_AGENT: "SPUTNIK/4.0 contact-configured-in-github"
          SPUTNIK_CIKS: "1849635"
          SPUTNIK_SEC_FORMS: "3,4,5,8-K,13D,13G,13F-HR,13F-HR/A,144"
          SPUTNIK_SOCIAL_ENABLED: "1"
          SPUTNIK_MORNING_HOUR: "5"
          SPUTNIK_TELEGRAM_POLLING: "0"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SPUTNIK_TELEGRAM_TEST: ${{ inputs.test_telegram }}
        run: python trump_tracker.py

      - name: Persist SPUTNIK state
        if: always()
        run: |
          if [ -f sputnik_state.json ]; then
            git config user.name "SPUTNIK Bot"
            git config user.email "sputnik-bot@users.noreply.github.com"
            git add sputnik_state.json
            git diff --cached --quiet || git commit -m "chore: persist Sputnik state"
            git fetch origin main
            if ! git rebase origin/main; then
              echo "SPUTNIK: conflitto di stato; mantengo il risultato del run corrente."
              git checkout --theirs sputnik_state.json
              git add sputnik_state.json
              GIT_EDITOR=true git rebase --continue
            fi
            git push origin main
          fi
