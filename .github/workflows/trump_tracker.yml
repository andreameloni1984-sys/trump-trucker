name: SPUTNIK

on:
  workflow_dispatch:
    inputs:
      test_telegram:
        description: "Invia un messaggio di test a Telegram"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

jobs:
  sputnik:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run SPUTNIK
        env:
          SEC_USER_AGENT: "SPUTNIK/3.0 contact-configured-in-github"
          SPUTNIK_CIKS: ${{ vars.SPUTNIK_CIKS }}
          SPUTNIK_SEC_FORMS: "3,4,5,13D,13G,13F-HR,13F-HR/A,144"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SPUTNIK_TELEGRAM_TEST: ${{ inputs.test_telegram }}
        run: python trump_tracker.py

      - name: Persist SPUTNIK state
        if: always()
        run: |
          if [ -f sputnik_state.json ]; then
            git config user.name "SPUTNIK Bot"
            git config user.email "sputnik-bot@users.noreply.github.com"
            git add sputnik_state.json
            git diff --cached --quiet || git commit -m "chore: persist Sputnik state"
            git push
          fi
