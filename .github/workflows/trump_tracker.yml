name: SPUTNIK

on:
  push:
    branches:
      - main
    paths:
      - "trump_tracker.py"
      - "sputnik_action_reaction.py"
      - "sputnik_decision.py"
      - "sputnik_cfd.py"
      - "tests/test_sputnik_cfd.py"
      - "tests/test_sputnik_decision.py"
      - "tests/test_sputnik_item_intelligence.py"
      - "telegram_listener.py"
      - ".github/workflows/trump_tracker.yml"
  workflow_dispatch:
    inputs:
      test_telegram:
        description: "Invia un messaggio di test a Telegram"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "2-59/5 * * * *"

permissions:
  actions: read
  contents: write

concurrency:
  group: sputnik-main
  queue: max
  cancel-in-progress: false

jobs:
  sputnik:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Report recent scheduled collector runs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          response="$RUNNER_TEMP/sputnik-scheduled-runs.json"
          if ! curl --fail --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GH_REPOSITORY}/actions/workflows/trump_tracker.yml/runs?event=schedule&per_page=20" \
            -o "$response"; then
            echo "::warning::SPUTNIK scheduled-run history unavailable; cadence diagnosis incomplete."
            exit 0
          fi
          python - "$response" <<'PY'
          import json
          import sys
          from datetime import datetime

          with open(sys.argv[1], encoding="utf-8") as handle:
              payload = json.load(handle)

          runs = payload.get("workflow_runs") or []
          runs.sort(key=lambda row: str(row.get("created_at") or ""))
          print("SPUTNIK: last scheduled collector runs (UTC)")
          previous = None
          for run in runs:
              created = str(run.get("created_at") or "")
              started = str(run.get("run_started_at") or "")
              print(
                  "SPUTNIK_SCHEDULE_RUN"
                  f" id={run.get('id')}"
                  f" number={run.get('run_number')}"
                  f" created_at={created}"
                  f" started_at={started or 'NOT_STARTED'}"
                  f" status={run.get('status')}"
                  f" conclusion={run.get('conclusion') or 'PENDING'}"
              )
              if previous and created and previous:
                  try:
                      current_dt = datetime.fromisoformat(created.replace("Z", "+00:00"))
                      previous_dt = datetime.fromisoformat(previous.replace("Z", "+00:00"))
                      gap_minutes = (current_dt - previous_dt).total_seconds() / 60
                      print(f"SPUTNIK_SCHEDULE_GAP minutes={gap_minutes:.1f} expected_interval=5")
                  except (TypeError, ValueError, OverflowError):
                      print("SPUTNIK_SCHEDULE_GAP unavailable: timestamp parse error")
              if created:
                  previous = created
          print(f"SPUTNIK_SCHEDULE_RUN_COUNT={len(runs)}")
          PY

      - name: Check Telegram configuration
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ]; then
            echo "Telegram token: PRESENTE"
          else
            echo "Telegram token: ASSENTE"
          fi
          if [ -n "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram chat ID: PRESENTE"
          else
            echo "Telegram chat ID: ASSENTE"
          fi
          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then
            echo "ERRORE: configura il GitHub Secret TELEGRAM_BOT_TOKEN."
            exit 1
          fi
          if [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "::error::TELEGRAM_CHAT_ID is required: the scheduled collector sets SPUTNIK_TELEGRAM_POLLING=0 and cannot auto-discover a destination."
            exit 1
          fi

      - name: Restore SPUTNIK state from dedicated branch
        id: restore_state
        run: |
          STATE_BRANCH="sputnik-state"
          REMOTE_REF="$(git ls-remote --heads origin "refs/heads/${STATE_BRANCH}")"
          if [ -n "$REMOTE_REF" ]; then
            git fetch origin "refs/heads/${STATE_BRANCH}:refs/remotes/origin/${STATE_BRANCH}"
            git show "refs/remotes/origin/${STATE_BRANCH}:sputnik_state.json" > sputnik_state.json
            echo "SPUTNIK state restored from ${STATE_BRANCH}."
          else
            echo "SPUTNIK state branch not present; using the tracked seed state."
          fi

      - name: Run SPUTNIK (Render-independent)
        env:
          SEC_USER_AGENT: "SPUTNIK/4.0 contact-configured-in-github"
          SPUTNIK_CIKS: "1849635"
          SPUTNIK_SEC_FORMS: "3,4,5,8-K,13D,13G,13F-HR,13F-HR/A,144"
          SPUTNIK_SOCIAL_ENABLED: "1"
          GAGARIN_CLOUD_API_URL: ${{ secrets.GAGARIN_CLOUD_API_URL }}
          GAGARIN_CLOUD_API_KEY: ${{ secrets.GAGARIN_CLOUD_API_KEY }}
          NARWHAL_REFERENCE_ENABLED: "1"
          NARWHAL_API_KEY: ${{ secrets.NARWHAL_API_KEY }}
          SPUTNIK_MORNING_HOUR: "5"
          SPUTNIK_TELEGRAM_POLLING: "0"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SPUTNIK_TELEGRAM_TEST: ${{ inputs.test_telegram }}
        run: python trump_tracker.py

      - name: Persist SPUTNIK state on sputnik-state branch
        if: always() && steps.restore_state.outcome == 'success'
        run: |
          if [ ! -f sputnik_state.json ]; then
            echo "SPUTNIK state file not present; nothing to persist."
            exit 0
          fi
          STATE_BRANCH="sputnik-state"
          STATE_WORKTREE="${RUNNER_TEMP}/sputnik-state-worktree"
          REMOTE_REF="$(git ls-remote --heads origin "refs/heads/${STATE_BRANCH}")"
          if [ -n "$REMOTE_REF" ]; then
            git fetch origin "refs/heads/${STATE_BRANCH}:refs/remotes/origin/${STATE_BRANCH}"
            git worktree add --detach "$STATE_WORKTREE" "refs/remotes/origin/${STATE_BRANCH}"
            BRANCH_CREATED=0
          else
            git worktree add -b "$STATE_BRANCH" "$STATE_WORKTREE" main
            BRANCH_CREATED=1
          fi
          cp sputnik_state.json "$STATE_WORKTREE/sputnik_state.json"
          (
            cd "$STATE_WORKTREE"
            git config user.name "SPUTNIK Bot"
            git config user.email "sputnik-bot@users.noreply.github.com"
            git add sputnik_state.json
            if ! git diff --cached --quiet; then
              git commit -m "chore: persist Sputnik state"
              git push origin HEAD:"refs/heads/${STATE_BRANCH}"
            elif [ "$BRANCH_CREATED" -eq 1 ]; then
              git push origin HEAD:"refs/heads/${STATE_BRANCH}"
            else
              echo "SPUTNIK state unchanged; no commit required."
            fi
          )
