name: SPUTNIK Telegram Polling

on:
  schedule:
    # Ogni 5 minuti (allineato al tracker principale)
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sputnik-telegram-polling
  cancel-in-progress: false

jobs:
  poll:
    name: Process pending Telegram updates
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests || true

      - name: Validate Telegram token
        run: |
          test -n "$TELEGRAM_BOT_TOKEN" || { echo "::error::TELEGRAM_BOT_TOKEN missing"; exit 1; }
          echo "Token present"

      - name: Run Sputnik polling runner
        run: python telegram/polling_runner.py
