name: SPUTNIK ranking tests

on:
  pull_request:
    paths:
      - "trump_tracker.py"
      - "sputnik_public_sources.py"
      - "tests/test_sputnik_public_sources.py"
      - "tests/test_sputnik_item_intelligence.py"
      - "sputnik_release_calendar.py"
      - "sputnik_event_outcomes.py"
      - "tests/test_sputnik_event_outcomes.py"
      - "sputnik_bea_calendar.py"
      - "tests/test_sputnik_bea_calendar.py"
      - "sputnik_pre_release_alerts.py"
      - "sputnik_bea_calendar.py"
      - "tests/test_sputnik_bea_calendar.py"
      - "tests/test_sputnik_release_calendar.py"
      - "tests/test_sputnik_pre_release_alerts.py"
      - ".github/workflows/sputnik_pre_release_alerts.yml"
      - "sputnik_ranking.py"
      - "sputnik_decision.py"
      - "sputnik_decision_engine.py"
      - "telegram_listener.py"
      - "tests/test_sputnik_decision_engine.py"
      - "tests/test_sputnik_decision.py"
      - "tests/test_sputnik_ranking.py"
      - "tests/test_sputnik_action_reaction.py"
      - "sputnik_action_reaction.py"
      - "tests/test_trump_tracker_form4.py"
      - "tests/test_sputnik_action_reaction.py"
      - "sputnik_action_reaction.py"
      - ".github/workflows/sputnik_tests.yml"
  push:
    branches:
      - main
    paths:
      - "sputnik_decision.py"
      - "sputnik_decision_engine.py"
      - "telegram_listener.py"
      - "tests/test_sputnik_decision_engine.py"
      - "tests/test_sputnik_decision.py"
      - "trump_tracker.py"
      - "sputnik_public_sources.py"
      - "tests/test_sputnik_public_sources.py"
      - "tests/test_sputnik_item_intelligence.py"
      - "sputnik_release_calendar.py"
      - "sputnik_pre_release_alerts.py"
      - "sputnik_bea_calendar.py"
      - "tests/test_sputnik_release_calendar.py"
      - "tests/test_sputnik_pre_release_alerts.py"
      - "tests/test_sputnik_bea_calendar.py"
      - ".github/workflows/sputnik_pre_release_alerts.yml"
      - "sputnik_ranking.py"
      - "tests/test_sputnik_ranking.py"
      - ".github/workflows/sputnik_tests.yml"

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run ranking tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
