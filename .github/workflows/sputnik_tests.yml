name: SPUTNIK ranking tests

on:
  pull_request:
    paths:
      - "trump_tracker.py"
      - "sputnik_ranking.py"
      - "tests/test_sputnik_ranking.py"
      - "tests/test_trump_tracker_form4.py"
      - ".github/workflows/sputnik_tests.yml"
  push:
    branches:
      - main
    paths:
      - "trump_tracker.py"
      - "sputnik_ranking.py"
      - "tests/test_sputnik_ranking.py"
      - ".github/workflows/sputnik_tests.yml"

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run ranking tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
