name: SPUTNIK ranking tests

on:
  pull_request:
    paths:
      - "trump_tracker.py"
      - "sputnik_public_feed_monitor.py"
      - "sputnik_ranking.py"
      - "sputnik_decision.py"
      - "sputnik_decision_engine.py"
      - "sputnik_decision_strict.py"
      - "SPUTNIK_RESEARCH_LOG.md"
      - "sputnik_cfd.py"
      - "sputnik_trading_instrument.py"
      - "sputnik_catalyst.py"
      - "tests/test_sputnik_trading_instrument.py"
      - "tests/test_sputnik_item_intelligence.py"
      - "tests/test_sputnik_state_branch_workflow.py"
      - ".github/workflows/trump_tracker.yml"
      - "telegram_listener.py"
      - "telegram_delivery.py"
      - "tests/test_telegram_delivery.py"
      - ".github/workflows/daily-summary.yml"
      - ".github/workflows/telegram-polling.yml"
      - "tests/test_sputnik_decision_engine.py"
      - "tests/test_sputnik_decision.py"
      - "tests/test_sputnik_ranking.py"
      - "tests/test_sputnik_action_reaction.py"
      - "sputnik_action_reaction.py"
      - "tests/test_trump_tracker_form4.py"
      - "tests/test_sputnik_action_reaction.py"
      - "sputnik_action_reaction.py"
      - ".github/workflows/sputnik_tests.yml"
  push:
    branches:
      - main
    paths:
      - "sputnik_trading_instrument.py"
      - "sputnik_catalyst.py"
      - ".github/workflows/sputnik_tests.yml"
      - ".github/workflows/trump_tracker.yml"
      - "tests/test_sputnik_state_branch_workflow.py"
      - "sputnik_decision.py"
      - "sputnik_decision_engine.py"
      - "sputnik_decision_strict.py"
      - "SPUTNIK_RESEARCH_LOG.md"
      - "sputnik_cfd.py"
      - "tests/test_sputnik_trading_instrument.py"
      - "tests/test_sputnik_item_intelligence.py"
      - "telegram_listener.py"
      - "telegram_delivery.py"
      - "tests/test_telegram_delivery.py"
      - ".github/workflows/daily-summary.yml"
      - "tests/test_sputnik_decision_engine.py"
      - "tests/test_sputnik_decision.py"
      - "trump_tracker.py"
      - "sputnik_ranking.py"
      - "tests/test_sputnik_ranking.py"

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run ranking tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
